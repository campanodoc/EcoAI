<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Framework EcoAI: Postumanesimo ecodigitale</title>
  <desc id="desc">Quattro domini disposti su due assi: ideale-reale e sistemico-individuale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#566159"/>
    </marker>
  </defs>
  <rect width="1200" height="800" rx="28" fill="#f7f5ef"/>
  <rect x="160" y="30" width="880" height="78" rx="18" fill="#285f49"/>
  <text x="600" y="81" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="38" font-weight="700">Postumanesimo ecodigitale</text>
  <line x1="150" y1="408" x2="1050" y2="408" stroke="#566159" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="600" y1="145" x2="600" y2="700" stroke="#566159" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="70" y="418" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Ideale</text>
  <text x="1130" y="418" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Reale</text>
  <text x="600" y="135" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Sistemico</text>
  <text x="600" y="744" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Individuale</text>
  <g>
    <rect x="140" y="175" width="400" height="170" rx="24" fill="#dbeadf" stroke="#3d7659" stroke-width="3"/>
    <rect x="660" y="175" width="400" height="170" rx="24" fill="#d9e8ef" stroke="#47738a" stroke-width="3"/>
    <rect x="140" y="475" width="400" height="170" rx="24" fill="#eaddef" stroke="#785a83" stroke-width="3"/>
    <rect x="660" y="475" width="400" height="170" rx="24" fill="#f2e5cf" stroke="#8b6c3f" stroke-width="3"/>
  </g>
  <text x="340" y="247" text-anchor="middle" fill="#254d39" font-family="Georgia, serif" font-size="31" font-weight="700">
    <tspan x="340">Comprensione</tspan><tspan x="340" dy="42">dei sistemi</tspan>
  </text>
  <text x="860" y="247" text-anchor="middle" fill="#315b70" font-family="Georgia, serif" font-size="29" font-weight="700">
    <tspan x="860">Comprensione ecologica</tspan><tspan x="860" dy="42">dell’IA</tspan>
  </text>
  <text x="340" y="547" text-anchor="middle" fill="#60466a" font-family="Georgia, serif" font-size="31" font-weight="700">
    <tspan x="340">Formazione</tspan><tspan x="340" dy="42">dell’identità</tspan>
  </text>
  <text x="860" y="547" text-anchor="middle" fill="#72552f" font-family="Georgia, serif" font-size="29" font-weight="700">
    <tspan x="860">Apprendimento mediato</tspan><tspan x="860" dy="42">da strumenti</tspan>
  </text>
</svg>
