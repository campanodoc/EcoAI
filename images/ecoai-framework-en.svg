<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">EcoAI Framework: Eco-Digital Posthumanism</title>
  <desc id="desc">Four domains arranged along ideal-real and systemic-individual axes.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#566159"/></marker>
  </defs>
  <rect y="-30" width="1600" height="1080" fill="#f7f5ef"/>
  <text x="800" y="22" text-anchor="middle" fill="#254d39" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="700">The Four Quadrants of the EcoAI Framework</text>
  <rect x="190" y="45" width="1220" height="105" rx="22" fill="#285f49" filter="url(#shadow)"/>
  <text x="800" y="112" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="50" font-weight="700">Eco-Digital Posthumanism</text>
  <line x1="250" y1="555" x2="1350" y2="555" stroke="#566159" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="800" y1="205" x2="800" y2="930" stroke="#566159" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="170" y="570" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Ideal</text>
  <text x="1430" y="570" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Real</text>
  <text x="800" y="192" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Systemic</text>
  <text x="800" y="985" text-anchor="middle" fill="#39433d" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">Individual</text>
  <g filter="url(#shadow)">
    <rect x="250" y="245" width="470" height="240" rx="28" fill="#dbeadf" stroke="#3d7659" stroke-width="4"/>
    <rect x="880" y="245" width="470" height="240" rx="28" fill="#d9e8ef" stroke="#47738a" stroke-width="4"/>
    <rect x="250" y="625" width="470" height="240" rx="28" fill="#eaddef" stroke="#785a83" stroke-width="4"/>
    <rect x="880" y="625" width="470" height="240" rx="28" fill="#f2e5cf" stroke="#8b6c3f" stroke-width="4"/>
  </g>
  <text x="485" y="340" text-anchor="middle" fill="#254d39" font-family="Georgia, serif" font-size="43" font-weight="700"><tspan x="485">Systems</tspan><tspan x="485" dy="54">Understanding</tspan></text>
  <text x="1115" y="340" text-anchor="middle" fill="#315b70" font-family="Georgia, serif" font-size="39" font-weight="700"><tspan x="1115">Ecological</tspan><tspan x="1115" dy="54">Understanding of AI</tspan></text>
  <text x="485" y="720" text-anchor="middle" fill="#60466a" font-family="Georgia, serif" font-size="43" font-weight="700"><tspan x="485">Identity</tspan><tspan x="485" dy="54">Formation</tspan></text>
  <text x="1115" y="720" text-anchor="middle" fill="#72552f" font-family="Georgia, serif" font-size="43" font-weight="700"><tspan x="1115">Tool-Based</tspan><tspan x="1115" dy="54">Learning</tspan></text>
</svg>
